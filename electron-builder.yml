# appId MUST match app.setAppUserModelId in src/main/index.ts —
# Windows attributes toast notifications through it.
appId: com.cedrickgd.sitsense
productName: SitSense
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - '!**/node_modules/**'
asarUnpack:
  - resources/** # tray ICOs need real file paths on disk
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
nsis:
  include: build/installer.nsh # removes the autostart entry on uninstall
  oneClick: true
  perMachine: false # per-user: no UAC prompt, HKCU autostart works cleanly
  createStartMenuShortcut: true # REQUIRED for reliable toasts (AUMID shortcut)
  createDesktopShortcut: true
  runAfterFinish: true
portable:
  artifactName: SitSense-portable-${version}.exe
npmRebuild: false
# Lock down what the shipped binary accepts from its environment: no running
# it as plain Node, no NODE_OPTIONS / --inspect injection, app code only from
# the asar archive.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  grantFileProtocolExtraPrivileges: false
