<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SitSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      PRODUCTION CSP: the renderer reaches nothing outside app:// (no http(s):, no ws:).
      'wasm-unsafe-eval' is required by the MediaPipe WASM runtime.
      The dev server adds ws: (HMR) and script-src 'unsafe-inline' (React Refresh
      preamble) at serve time only, and the build fails if this tag allows either
      (cspPlugin in electron.vite.config.ts).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data:; media-src 'self' blob: mediastream:; worker-src 'self' blob:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
