<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SitSense</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      'wasm-unsafe-eval' is required by the MediaPipe WASM runtime.
      'unsafe-inline' script-src is required by the React dev-server preamble only,
      but the app loads no remote content whatsoever, so the practical exposure is nil.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: blob: data:; media-src 'self' blob: mediastream:; worker-src 'self' blob:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
